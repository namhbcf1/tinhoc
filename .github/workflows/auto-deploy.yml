name: 🚀 Auto Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/auto-deploy.yml'
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  # ─── BACKEND TESTS ────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run backend tests
        run: npm test -- --run

  # ─── FRONTEND TESTS + BUILD ────────────────────────────────────
  test-frontend:
    name: 🧪 Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run frontend tests
        run: npm test -- --run
        continue-on-error: true # Frontend hiện chưa có test files; bỏ qua khi không có test

      - name: 🔨 Build frontend (smoke test)
        run: npm run build:prod
        env:
          VITE_API_URL: https://vantrangedu-api.bangachieu2.workers.dev

      - name: 🔍 Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist folder not found"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la dist/

  # ─── DEPLOY BACKEND ───────────────────────────────────────────
  deploy-backend:
    name: 📦 Deploy Backend (Workers)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Authenticate Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy Backend
        run: wrangler deploy
        working-directory: ./backend
        continue-on-error: false

      - name: ✅ Backend deployed
        run: |
          echo "✅ Backend deployed successfully!"
          echo "URL: https://vantrangedu-api.bangachieu2.workers.dev"

  # ─── DEPLOY FRONTEND ──────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build Frontend
        run: npm run build:prod
        env:
          VITE_API_URL: https://vantrangedu-api.bangachieu2.workers.dev

      - name: 🔍 Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist folder not found"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la dist/

      - name: 🔐 Authenticate Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy Frontend to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=vantrangedu
        working-directory: ./frontend
        continue-on-error: false

      - name: ✅ Frontend deployed
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "URL: https://vantrangedu.pages.dev"
          echo "Custom Domain: https://vantrangedu.com"

  # ─── DEPLOY SUMMARY ───────────────────────────────────────────
  deploy-summary:
    name: 📊 Deploy Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: 📝 Deploy Summary
        run: |
          echo "## 🎉 Deploy Hoàn Tất!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Backend (Workers)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://vantrangedu-api.bangachieu2.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Frontend (Pages)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://vantrangedu.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Custom Domain: https://vantrangedu.com" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Commit Info" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Message: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏰ Deploy Time" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
