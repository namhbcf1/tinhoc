name: Tự động Deploy lên Cloudflare Pages (VantrangEdu)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code Khóa Học 📥
        uses: actions/checkout@v4

      - name: Setup Node.js 20 ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './vantrangedu-app/package-lock.json'

      - name: Cài đặt Dependencies 📦
        working-directory: ./vantrangedu-app
        run: npm ci

      - name: Chạy Linter & Unit Tests 🧪
        working-directory: ./vantrangedu-app
        run: |
          npx @biomejs/biome check .
          npx vitest run

      - name: Build Next.js App Router mượt mà 🚀
        working-directory: ./vantrangedu-app
        run: npx @cloudflare/next-on-pages

      - name: Bắt Chế Độ Đẩy Sang Cloudflare Pages ☁️
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vantrangedu-app
          directory: ./vantrangedu-app/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
